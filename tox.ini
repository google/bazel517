[tox]
min_version = 4.0
env_list =
    py311
    py312
    py313
    py313t
    py314
    py314t
    py315
    py315t
    lint
    typecheck

[testenv]
description = Run the test suite under pytest with coverage
dependency_groups = test
commands =
    pytest --cov {posargs}

[testenv:lint]
description = Run Ruff linter and formatter checks
skip_install = true
dependency_groups = lint
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
description = Run static type checking with pyrefly
dependency_groups =
    lint
    test
commands =
    pyrefly check {posargs:src/ tests/}
